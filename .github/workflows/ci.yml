# Checks on pull requests. On master the same checks run inside deploy.yml, as the gate in front
# of shipping, so running them here as well would only double every merge.
name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The app compiles against types emitted by the api build, so this has to come first.
      - name: Build api
        run: bun run --cwd api build

      - run: bun run typecheck
      - run: bunx oxlint

      # MinIO runs as a plain container rather than a service container: service containers cannot
      # override the image's command, and this image does nothing until told `server /data`.
      #
      # It is here because the storage tests skip themselves when no S3 server is pointed at, which
      # keeps `bun test` cheap on a laptop — but skipped is not passing, and the signing path is
      # exactly the part worth exercising against a real server. MinIO stands in for R2 here just
      # as it does in self-hosted deployments. The bucket is created by the test fixture, so
      # nothing else has to be installed.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=lovbase -e MINIO_ROOT_PASSWORD=lovbase123 \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Test
        run: bun run test
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_BUCKET: lovbase-test
          S3_TEST_KEY: lovbase
          S3_TEST_SECRET: lovbase123

      # Catches the class of break that only shows up in a production build: a missing ARG, a
      # dependency that was only ever a devDependency, a path that differs outside the workspace.
      - name: Build the production image
        run: docker build -t lovbase-app:ci .
