name: Deploy
on:
  push:
    branches: [master]
    paths-ignore: ['README.md', 'README.zh-CN.md', 'DEPLOY.md', 'LICENSE']
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/check.yml
  deploy:
    needs: check
    if: vars.PRODUCTION_DEPLOY_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Deploy Web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bunx @railway/cli up --service lovbase-app --ci
      - name: Deploy Worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bunx @railway/cli up --service lovbase-worker --ci
      - name: Deploy sandbox from the same tested commit
        run: bun run --cwd sandbox deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: bash .github/scripts/verify-deploy.sh
