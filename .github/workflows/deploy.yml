# Deploy on merge to master, after the checks pass.
#
# Railway can deploy from GitHub by itself, but it deploys whatever was pushed — a red test does
# not stop it. Going through Actions means only a commit that passed is ever shipped.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-app
  cancel-in-progress: false

jobs:
  # Same checks as ci.yml. Duplicated deliberately rather than chained: a deploy should not depend
  # on another workflow's run having been scheduled, and this is the gate that matters.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd api build
      - run: bun run typecheck
      - run: bunx oxlint
      # MinIO runs as a plain container rather than a service container: service containers cannot
      # override the image's command, and this image does nothing until told `server /data`.
      #
      # It is here because the storage tests skip themselves when no S3 server is pointed at, which
      # keeps `bun test` cheap on a laptop — but skipped is not passing, and the signing path is
      # exactly the part worth exercising against a real server. MinIO stands in for R2 here just
      # as it does in self-hosted deployments. The bucket is created by the test fixture, so
      # nothing else has to be installed.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=lovbase -e MINIO_ROOT_PASSWORD=lovbase123 \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
      - run: bun run test
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_BUCKET: lovbase-test
          S3_TEST_KEY: lovbase
          S3_TEST_SECRET: lovbase123

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `railway up` uploads this directory and builds it with the root Dockerfile (railway.toml).
      # An earlier version built the image here and pushed it to ghcr instead, which is tidier in
      # principle — deploy the exact bytes that were tested — but it needs the package to be public
      # or Railway to hold registry credentials, and neither is worth the moving parts for a build
      # that is deterministic from a commit anyway.
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bunx @railway/cli up --service lovbase-app --ci

      # `railway up --ci` returns when the build log ends, which is not the same as the site being
      # up, so the pipeline asks the site itself before calling this a success.
      - name: Verify
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: bash .github/scripts/verify-deploy.sh
