# ── Sandbox runner only: the main app lives on Railway, this machine runs the generated apps' containers ──
#
# Why this exists: Cloudflare Containers bill per vCPU-second and memory-second, with no hard spending cap.
# Moving the sandbox to a fixed-price server leaves Cloudflare with no metered line item of any size,
# the bill becomes "5 dollars plus a negligible request fee", and this machine is a fixed monthly cost.
#
#   docker build -f sandbox/runner/Dockerfile -t lovbase-sandbox:local sandbox   # the image generated apps run in
#   docker compose -f docker-compose.runner.yml up -d
#
# Then in the main app's (Railway) environment variables:
#   SANDBOX_URL=https://sandbox.your-domain
#   SANDBOX_INTERNAL_TOKEN=the same value as INTERNAL_TOKEN below
#
# This machine needs a public entry point. Put a Caddy or Nginx in front: 8788 over HTTPS for the main app to call,
# and the preview port range proxied to PREVIEW_HOST. For multi-tenant use, switch the Docker runtime to gVisor.
services:
  sandbox-runner:
    build: { context: ./sandbox, dockerfile: runner/Dockerfile.runner }
    restart: unless-stopped
    environment:
      PORT: 8788
      # The main app calls with this token; it must equal the main app's SANDBOX_INTERNAL_TOKEN
      INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:?set SANDBOX_INTERNAL_TOKEN}
      SANDBOX_IMAGE: lovbase-sandbox:local
      # Generated app containers reach the main app over the public internet; set the main app's domain
      LOVBASE_API_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://lovbase.app}
      LOVBASE_PUBLIC_API_URL: ${PUBLIC_URL}
      # The public hostname of preview links, i.e. this machine's domain
      PREVIEW_HOST: ${PREVIEW_HOST:?set PREVIEW_HOST, e.g. sandbox.lovbase.app}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    ports: ["8788:8788"]
